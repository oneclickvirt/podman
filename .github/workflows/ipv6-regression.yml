name: IPv6 Script Regression
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  ipv6-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install ShellCheck
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends shellcheck
    - name: Validate shell scripts
      shell: bash
      run: |
        set -euo pipefail
        mapfile -d '' shell_files < <(
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 | sort -z
        )
        ((${#shell_files[@]} > 0)) || exit 0
        for file in "${shell_files[@]}"; do
          bash -n "$file"
        done
        shellcheck -S error -- "${shell_files[@]}"
    - name: Run IPv6 regression tests
      shell: bash
      run: |
        set -euo pipefail
        bash tests/test_ipv6_network.sh
        bash tests/initialization_test.sh
        bash tests/noninteractive_mode_test.sh
        bash tests/test_btrfs_disk_limit.sh
        bash tests/test_ssh_ipv6_listener.sh

        bash tests/host_ipv6_preservation_test.sh
        bash tests/uninstall_package_test.sh
'on':
  push:
    paths:
    - '**/*.sh'
    - .github/workflows/ipv6-regression.yml
  pull_request:
    paths:
    - '**/*.sh'
    - .github/workflows/ipv6-regression.yml
  workflow_dispatch: null
